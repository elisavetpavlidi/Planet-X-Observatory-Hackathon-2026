name: EUREKA v5 Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eureka-v5:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Verify EUREKA v5
        run: bash scripts/check_eureka.sh
